<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TMS Suprokom · Crear y despachar guía (versión C)</title>
<style>
  :root { --tx:#1E2A3F; --tx2:#4A5568; --pri:#12306B; --acc:#B3202F; --ok:#1E6B3A; --okbg:#E8F5EC; --wr:#8A4B00; --wrbg:#FFF4E0; --er:#B42318; --erbg:#FDECEA; --fo:#1F5FD6; --ln:#CBD2DC; --bg:#F5F6F9; }
  * { box-sizing: border-box; }
  body { margin:0; font: 16px/1.45 Arial, Helvetica, sans-serif; color:var(--tx); background:var(--bg); }
  header { background:var(--pri); color:#fff; padding:12px 24px; display:flex; justify-content:space-between; align-items:center; }
  header b { font-size:18px; }
  .wrap { display:flex; min-height:calc(100vh - 48px); }
  nav { width:200px; background:#fff; border-right:1px solid var(--ln); padding:16px 0; }
  nav a { display:block; padding:10px 20px; color:var(--tx); text-decoration:none; }
  nav a[aria-current] { background:#E6EBF4; font-weight:bold; border-left:4px solid var(--pri); }
  main { flex:1; padding:24px 32px 96px; }
  h1 { font-size:28px; margin:0 0 4px; }
  .sub { color:var(--tx2); font-size:14px; }
  label { display:block; font-size:14px; font-weight:bold; margin:12px 0 4px; }
  input, select { font:inherit; padding:8px 10px; border:1px solid #6B7280; border-radius:6px; width:100%; max-width:360px; background:#fff; color:var(--tx); }
  button { font:inherit; padding:9px 16px; border-radius:6px; border:1px solid var(--pri); background:#fff; color:var(--pri); cursor:pointer; font-weight:bold; }
  button.pri { background:var(--pri); color:#fff; }
  button:disabled { opacity:.55; cursor:not-allowed; }
  :focus-visible { outline:3px solid var(--fo); outline-offset:2px; }
  table { border-collapse:collapse; width:100%; background:#fff; margin-top:16px; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--ln); font-size:15px; }
  th { background:#E6EBF4; font-size:14px; }
  .bar { position:fixed; left:200px; right:0; bottom:0; background:#fff; border-top:2px solid var(--pri); padding:12px 32px; display:flex; justify-content:space-between; align-items:center; }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:14px; font-weight:bold; border:1px solid currentColor; }
  .msg { border-radius:6px; padding:10px 14px; margin:12px 0; font-weight:bold; }
  .msg.er { color:var(--er); background:var(--erbg); border:1px solid var(--er); }
  .msg.ok { color:var(--ok); background:var(--okbg); border:1px solid var(--ok); }
  .msg.wr { color:var(--wr); background:var(--wrbg); border:1px solid var(--wr); }
  .fielderr { color:var(--er); font-size:14px; font-weight:bold; margin-top:4px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:0 32px; max-width:820px; }
  .card { background:#fff; border:1px solid var(--ln); border-radius:8px; padding:16px 20px; margin-top:16px; max-width:820px; }
  ol.hist { list-style:none; padding:0; margin:8px 0 0; }
  ol.hist li { border-left:3px solid var(--pri); padding:4px 0 4px 12px; margin-bottom:4px; }
  .scrim { position:fixed; inset:0; background:rgba(20,30,50,.45); display:flex; align-items:center; justify-content:center; }
  .dialog { background:#fff; border-radius:10px; padding:24px; width:460px; }
  .dialog h2 { margin:0 0 8px; font-size:22px; }
  .dialog .acts { display:flex; flex-direction:column; gap:8px; margin-top:16px; }
  .pager { display:flex; gap:8px; justify-content:flex-end; align-items:center; margin-top:8px; font-size:14px; }
  [hidden] { display:none !important; }
  .dialog dl { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:12px 0 0; font-size:15px; }
  .dialog dt { color:var(--tx2); }
  .dialog dd { margin:0; font-weight:bold; }
  .dialog .row { display:flex; gap:8px; justify-content:flex-end; margin-top:20px; }
  .undo { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .undo .left { font-weight:normal; color:var(--tx); }
  .ver { font-size:13px; opacity:.85; margin-left:8px; }
  #app:focus { outline:none; }
  .steps { display:flex; gap:8px; margin:14px 0 4px; max-width:820px; }
  .steps span { flex:1; padding:6px 10px; border-radius:6px; background:#fff; border:1px solid var(--ln); font-size:14px; color:var(--tx2); }
  .steps span.on { border:2px solid var(--pri); color:var(--pri); font-weight:bold; }
  .steps span.done { color:var(--ok); }
  .saved { font-size:14px; color:var(--ok); font-weight:bold; }
  button:hover:not(:disabled) { background:#E6EBF4; } button.pri:hover:not(:disabled) { background:#0B2150; }
  tbody tr:hover td { background:#F0F4FA; }
</style>
</head>
<body>
<header><b>TMS Suprokom<span class="ver">· versión C</span></b><span>Marta R. · Bodega</span></header>
<div class="wrap">
  <nav aria-label="Menú principal"><a href="#p1" aria-current="page">Pedidos pendientes</a><a href="#guias">Guías</a><a href="formatos.html">Otros formatos</a></nav>
  <main id="app" tabindex="-1"></main>
</div>
<div id="live" class="sr" aria-live="polite" style="position:absolute;left:-9999px"></div>
<script>
const ORDERS = [
  {id:'PE07-0001201', cli:'Ferretería La 30', city:'Manizales', u:18, v:'$ 441.200', dir:'Cra 23 # 30-15, Manizales', tel:'606 884 2210'},
  {id:'PE31-0001202', cli:'Agro El Cafetal', city:'Manizales', u:12, v:'$ 719.100', dir:'Cl 48 # 22-10, Manizales', tel:'606 885 1020'},
  {id:'PE14-0001203', cli:'Distribuidora Andina', city:'Salamina', u:16, v:'$ 506.200', dir:'Cra 6 # 4-21, Salamina', tel:'606 859 3310'},
  {id:'PE05-0001204', cli:'Tienda La Esquina', city:'Manizales', u:9, v:'$ 210.000', dir:'Cl 65 # 23-05, Manizales', tel:'606 887 4455'},
  {id:'PE07-0001205', cli:'Surtiaseo del Norte', city:'Manizales', u:6, v:'$ 154.300', dir:'Av. Santander # 70-12, Manizales', tel:'606 886 9090'},
];
const S = { sel:new Set(), page:1, conductor:'', cajas:'6', lios:'2', flete:'30.000', tries:0, hist:[], group:'split',
  dtries:0, undoable:false };
// HZ-01 (D-34): «Deshacer despacho» sin límite de tiempo mientras la guía siga en P5 (WCAG 2.2.1);
// se cierra al pasar a la siguiente guía. Fallo simulado del despacho solo con ?simular=fallo-despacho.
const FAIL_DISPATCH = new URLSearchParams(location.search).get('simular') === 'fallo-despacho';
const TRA = 'Transportes El Roble', CON = 'Andrés Mejía · ABC123';
// EDA-03, HZ-09, HZ-10: la guía se arma con los pedidos elegidos (datos ficticios)
function guia() {
  const sel = ORDERS.filter(o=>S.sel.has(o.id));
  const city = S.group==='group' ? (S.destCity || sel[0].city) : sel[0].city;
  const ped = S.group==='group' ? sel : sel.filter(o=>o.city===city);
  const otras = S.group==='group' ? [] : [...new Set(sel.map(o=>o.city))].filter(c=>c!==city);
  const d = ped.find(o=>o.city===city) || ped[0];          // destinatario: el pedido de la ciudad destino
  return { city, ped, otras, cli:d.cli, dir:d.dir, tel:d.tel,
           lista: ped.map(o=>`${o.id} (${o.cli})`).join(' · ') };
}
const app = document.getElementById('app'), live = document.getElementById('live');
const say = t => { live.textContent = ''; setTimeout(()=> live.textContent = t, 30); };
const cities = () => [...new Set(ORDERS.filter(o=>S.sel.has(o.id)).map(o=>o.city))];
const stepper = n => `<div class="steps" aria-label="Progreso de la guía">${['1. Pedidos','2. Datos de entrega','3. Empaque y plataforma','4. Despacho'].map((t,i)=>`<span class="${i+1===n?'on':i+1<n?'done':''}" ${i+1===n?'aria-current="step"':''}>${i+1<n?'✓ ':''}${t}</span>`).join('')}</div>`;
const log = (st) => { const t = ['09:02','09:10','09:18','09:21','09:22','09:24','09:25'][S.hist.length] || '09:30'; S.hist.push({t, st, by:'Marta R.'}); };
let lastFocus = null;

function p1() {
  const per = 3, pages = Math.ceil(ORDERS.length/per), rows = ORDERS.slice((S.page-1)*per, S.page*per);
  const onPage = rows.filter(o=>S.sel.has(o.id)).length;
  app.innerHTML = `
    <h1>Pedidos pendientes</h1>
    <p class="sub">Actualizado a las 10:00 desde el ERP · <button type="button" id="sync">Sincronizar</button></p>
    <label for="q">Buscar pedido o cliente</label><input id="q" placeholder="Ej.: PE07 o Ferretería">
    <table><caption class="sub" style="text-align:left;padding:6px 0">Página ${S.page} de ${pages}</caption>
      <thead><tr><th scope="col">Seleccionar</th><th scope="col">Pedido</th><th scope="col">Cliente</th><th scope="col">Ciudad</th><th scope="col">Unidades</th><th scope="col">Valor</th></tr></thead>
      <tbody>${rows.map(o=>`<tr><td><input type="checkbox" id="c-${o.id}" ${S.sel.has(o.id)?'checked':''} aria-label="Seleccionar pedido ${o.id} de ${o.cli}" style="width:auto"></td>
        <td>${o.id}</td><td>${o.cli}</td><td>${o.city}</td><td>${o.u}</td><td>${o.v}</td></tr>`).join('')}</tbody></table>
    <div class="pager"><button type="button" id="prev" ${S.page===1?'disabled':''}>‹ Anterior</button><span>Página ${S.page} de ${pages}</span><button type="button" id="next" ${S.page===pages?'disabled':''}>Siguiente ›</button></div>
    <div class="bar" role="region" aria-label="Resumen de la selección">
      <span><b>${S.sel.size} pedido${S.sel.size===1?'':'s'} seleccionado${S.sel.size===1?'':'s'}</b> (${onPage} en esta página)${cities().length>1?` · <span class="pill" style="color:var(--wr)">⚠ ${cities().length} ciudades</span>`:''}</span>
      <button class="pri" id="gen" ${S.sel.size?'':'disabled'}>Generar guía (G)</button>
    </div>`;
  rows.forEach(o=> document.getElementById('c-'+o.id).onchange = e => { e.target.checked ? S.sel.add(o.id) : S.sel.delete(o.id); p1(); document.getElementById('c-'+o.id).focus(); say(`${S.sel.size} pedidos seleccionados`); });
  document.getElementById('prev').onclick = ()=>{ S.page--; p1(); };
  document.getElementById('next').onclick = ()=>{ S.page++; p1(); };
  document.getElementById('sync').onclick = ()=> say('Pedidos actualizados');
  document.getElementById('gen').onclick = generate;
}
function generate() {
  if (!S.sel.size) return;
  if (cities().length > 1) return openDialog();
  S.group = 'single'; go('#p3');
}
function openDialog() {
  lastFocus = document.activeElement;
  const c = cities(), byCity = c.map(ci => { const os = ORDERS.filter(o=>S.sel.has(o.id)&&o.city===ci);
    return `<li><b>${ci}</b> (${os.length}): ${os.map(o=>`${o.id} · ${o.cli}`).join(', ')}</li>`; }).join('');
  const sc = document.createElement('div'); sc.className = 'scrim'; sc.id = 'scrim';
  sc.innerHTML = `<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dt" aria-describedby="dd">
      <h2 id="dt">Estos pedidos van a ${c.length} ciudades</h2>
      <div id="dd"><p style="margin:0 0 4px">Una guía debe tener un solo destino.</p><ul style="margin:0;padding-left:20px">${byCity}</ul></div>
      <div class="acts">
        <button class="pri" id="split">Crear una guía por ciudad (recomendado)</button>
        <button id="group">Agrupar en una sola y elegir destino</button>
        <div id="dest" hidden><label for="destsel">Destino de la guía</label><select id="destsel">${c.map(ci=>`<option>${ci}</option>`).join('')}</select>
          <button class="pri" id="groupok" style="margin-top:8px">Crear guía con este destino</button></div>
        <button id="back">Volver a la selección (Esc)</button>
      </div></div>`;
  document.body.appendChild(sc);
  const focusables = () => [...sc.querySelectorAll('button:not([hidden]),select')].filter(e=>e.offsetParent);
  focusables()[0].focus();
  sc.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeDialog(); }
    if (e.key === 'Tab') { const f = focusables(), i = f.indexOf(document.activeElement);
      if (e.shiftKey && i<=0) { e.preventDefault(); f[f.length-1].focus(); } else if (!e.shiftKey && i===f.length-1) { e.preventDefault(); f[0].focus(); } }
  });
  sc.querySelector('#split').onclick = ()=>{ S.group='split'; closeDialog(true); go('#p3'); };
  sc.querySelector('#group').onclick = ()=>{ sc.querySelector('#dest').hidden = false; sc.querySelector('#destsel').focus(); };
  sc.querySelector('#groupok').onclick = ()=>{ S.group='group'; S.destCity = sc.querySelector('#destsel').value; closeDialog(true); go('#p3'); };
  sc.querySelector('#back').onclick = ()=> closeDialog();
}
function closeDialog(silent) { const sc = document.getElementById('scrim'); if (sc) sc.remove(); if (!silent && lastFocus) lastFocus.focus(); }

function p3() {
  if (!S.hist.length) log('Pendiente');
  app.innerHTML = `
    <h1>Guía TMS-2026-0412 <span class="pill" style="color:var(--tx2)">Pendiente</span></h1>${stepper(2)}<p class="saved">✓ Guardado automáticamente · 09:02</p>
    ${(()=>{ const g = guia();
      const msg = g.otras.length ? `Se crearon ${g.otras.length+1} guías: esta (${g.city}) y ${g.otras.map((c,i)=>`TMS-2026-0${413+i} (${c})`).join(', ')}.`
                : S.group==='group' ? `Guía agrupada con destino ${g.city}.` : '';
      return (msg ? `<p class="sub">${msg}</p>` : '') + `<p class="sub"><b>Pedidos en esta guía:</b> ${g.lista}</p>`; })()}
    <div class="card"><div class="grid">
      <div><label for="dest">Destinatario</label><input id="dest" value="${guia().cli}">
           <label for="tel">Teléfono</label><input id="tel" value="${guia().tel}"></div>
      <div><label for="dir">Dirección</label><input id="dir" value="${guia().dir}">
           <label for="tra">Transportadora</label><select id="tra"><option>Transportes El Roble</option></select></div>
      <div><label for="con">Conductor (obligatorio)</label><select id="con" aria-describedby="conerr" ${S.err?'aria-invalid="true"':''}>
           <option value="">Selecciona un conductor</option><option ${S.conductor?'selected':''}>Andrés Mejía · ABC123</option></select>
           <div id="conerr" class="fielderr" ${S.err?'':'hidden'}>✕ Falta el conductor. Selecciónalo para continuar.</div></div>
    </div></div>
    <p><button id="back">← Volver a pedidos</button> <button class="pri" id="ready">Lista para empacar</button></p>`;
  document.getElementById('con').onchange = e => { S.conductor = e.target.value; S.err = false; document.getElementById('conerr').hidden = true; e.target.removeAttribute('aria-invalid'); };
  document.getElementById('back').onclick = ()=> go('#p1');
  document.getElementById('ready').onclick = ()=>{
    if (!S.conductor) { S.err = true; p3(); document.getElementById('con').focus(); say('Falta el conductor'); return; }
    log('En preparación'); go('#p4');
  };
}
function p4(state) {
  app.innerHTML = `
    <h1>Guía TMS-2026-0412 <span class="pill" style="color:var(--wr)">${state==='plat'?'En plataforma':'En preparación'}</span></h1>${stepper(state==='plat'?4:3)}<p class="saved">✓ Guardado automáticamente · 09:10</p>
    <p class="sub">${guia().cli} · ${guia().city} · ${TRA} · ${CON.split(' · ')[0]} · Pedidos: ${guia().lista}</p>
    <div class="card"><h2 style="margin:0;font-size:20px">Registrar empaque</h2><div class="grid">
      <div><label for="caj">Cajas</label><input id="caj" type="number" min="0" value="${S.cajas}"></div>
      <div><label for="lio">Líos</label><input id="lio" type="number" min="0" value="${S.lios}"></div>
      <div><label for="fle">Flete ($)</label><input id="fle" value="${S.flete}"></div></div></div>
    <div id="m" role="alert"></div>
    <p>${state==='plat'
      ? '<button class="pri" id="desp">Despachar · pasa a En tránsito</button>'
      : '<button id="back">← Regresar a pendiente</button> <button class="pri" id="mov">Mover a plataforma</button>'}</p>`;
  ['caj','lio','fle'].forEach(k=> document.getElementById(k).oninput = e => { S[{caj:'cajas',lio:'lios',fle:'flete'}[k]] = e.target.value; });
  const m = document.getElementById('m');
  if (state==='plat') { document.getElementById('desp').onclick = openConfirm; return; }
  document.getElementById('back').onclick = ()=> go('#p3');
  const mov = document.getElementById('mov');
  mov.onclick = ()=>{
    mov.disabled = true; mov.textContent = 'Moviendo…'; m.innerHTML = '';
    setTimeout(()=>{
      S.tries++;
      if (S.tries === 1) {
        mov.disabled = false; mov.textContent = 'Mover a plataforma';
        m.innerHTML = '<div class="msg er">✕ No se pudo mover a plataforma: el servidor no respondió. Tus datos siguen guardados. <button id="retry">Reintentar</button></div>';
        document.getElementById('retry').onclick = ()=> mov.click();
        document.getElementById('retry').focus();
      } else { log('En plataforma'); p4('plat'); showPlatMsg('✓ La guía está en plataforma. Revisa los datos antes de despachar.'); }
    }, 900);
  };
}
// Mensaje en P4 (En plataforma): el foco va al mensaje, nunca al botón «Despachar» (HZ-01)
function showPlatMsg(html, cls='ok') {
  const m = document.getElementById('m');
  m.innerHTML = `<div class="msg ${cls}" tabindex="-1" id="platmsg">${html}</div>`;
  document.getElementById('platmsg').focus();
}
function openConfirm() {
  lastFocus = document.getElementById('desp');
  const sc = document.createElement('div'); sc.className = 'scrim'; sc.id = 'scrim';
  sc.innerHTML = `<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="ct" aria-describedby="cd">
      <h2 id="ct">¿Despachar la guía TMS-2026-0412?</h2>
      <p id="cd" style="margin:0">La guía pasará a <b>En tránsito</b>. Revisa que los datos sean los de esta guía.</p>
      <dl>
        <dt>Destino</dt><dd>${guia().cli} · ${guia().city}</dd>
        <dt>Pedidos</dt><dd>${guia().lista}</dd>
        <dt>Transportadora</dt><dd>${TRA}</dd>
        <dt>Conductor</dt><dd>${CON}</dd>
        <dt>Empaque</dt><dd>${S.cajas} cajas · ${S.lios} líos · flete $ ${S.flete}</dd>
      </dl>
      <div class="row"><button id="cancel">Cancelar (Esc)</button><button class="pri" id="confirm">Sí, despachar</button></div>
    </div>`;
  document.body.appendChild(sc);
  const f = [sc.querySelector('#cancel'), sc.querySelector('#confirm')];
  f[0].focus();                                   // el foco inicial es la opción segura
  sc.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.preventDefault(); cancelConfirm(); }
    if (e.key === 'Tab') { const i = f.indexOf(document.activeElement);
      if (e.shiftKey && i<=0) { e.preventDefault(); f[1].focus(); } else if (!e.shiftKey && i===1) { e.preventDefault(); f[0].focus(); } }
  });
  f[0].onclick = cancelConfirm;
  f[1].onclick = ()=>{ closeDialog(true); dispatch(); };
}
function cancelConfirm() { closeDialog(); say('Despacho cancelado. La guía sigue En plataforma.'); }
function dispatch() {
  const b = document.getElementById('desp'), m = document.getElementById('m');
  b.disabled = true; b.textContent = 'Despachando…'; m.innerHTML = ''; say('Despachando la guía');
  setTimeout(()=>{
    S.dtries++;
    if (FAIL_DISPATCH && S.dtries === 1) {
      b.disabled = false; b.textContent = 'Despachar · pasa a En tránsito';
      m.innerHTML = '<div class="msg er">✕ No se pudo despachar: el servidor no respondió. La guía sigue <b>En plataforma</b> y tus datos están guardados. <button id="dretry">Reintentar despacho</button></div>';
      document.getElementById('dretry').onclick = dispatch;
      document.getElementById('dretry').focus();
      return;
    }
    log('En tránsito'); S.undoable = true; go('#p5');
  }, 900);
}
function undoDispatch() {
  S.undoable = false;
  log('Despacho deshecho → En plataforma'); S.undone = true;
  go('#p4p');
}
function undoBanner() {
  if (!S.undoable) return '<div class="msg ok" role="status">✓ Guía TMS-2026-0412 despachada: ahora está En tránsito.</div>';
  return `<div class="msg ok undo" role="status"><span>✓ Guía TMS-2026-0412 despachada: ahora está En tránsito.</span>
    <button id="undo">Deshacer despacho</button><span class="left" id="undoleft">Puedes deshacerlo mientras sigas en esta pantalla.</span></div>`;
}
function armUndo() { const btn = document.getElementById('undo'); if (btn) btn.onclick = undoDispatch; }
function p5() {
  app.innerHTML = `
    ${undoBanner()}
    <h1>Guía TMS-2026-0412 <span class="pill" style="color:var(--ok)">✓ En tránsito</span></h1>${stepper(5)}
    <div class="card"><b>Resumen</b><p class="sub" style="margin:4px 0">${guia().cli} · ${guia().dir || guia().city} · ${TRA} · Andrés Mejía (ABC123) · ${S.cajas} cajas, ${S.lios} líos · Flete $ ${S.flete} · Pedidos: ${guia().lista}</p></div>
    <div class="card"><b>Historial</b><ol class="hist">${S.hist.map(h=>`<li><b>${h.t}</b> · ${h.st} · ${h.by}</li>`).join('')}</ol></div>
    <p><button class="pri" id="next">Ver siguiente guía</button></p>`;
  document.getElementById('next').onclick = ()=>{ Object.assign(S, {sel:new Set(), page:1, conductor:'', tries:0, dtries:0, undoable:false, undone:false, hist:[], err:false}); go('#p1'); };
  armUndo();
}
function go(h) { if (location.hash === h) route(); else location.hash = h; }
function route() {
  const h = location.hash || '#p1';
  if (h !== '#p5') S.undoable = false;          // salir de P5 cierra la posibilidad de deshacer
  if (h === '#p3' && !S.sel.size) { ['PE07-0001201','PE14-0001203'].forEach(i=>S.sel.add(i)); S.group = 'split'; }
  if (['#p4','#p4e','#p4p','#p5'].includes(h) && !S.sel.size) { S.sel.add('PE07-0001201'); S.group = 'single'; }
  if (h === '#p4' && !S.conductor) { S.conductor = 'Andrés Mejía · ABC123'; if (!S.hist.length) log('Pendiente'); if (S.hist.length<2) log('En preparación'); }
  if (h === '#p5' && S.hist.length < 4) { S.conductor = S.conductor || 'x'; while (S.hist.length < 4) log(['Pendiente','En preparación','En plataforma','En tránsito'][S.hist.length]); }
  if (h === '#p2') { ['PE07-0001201','PE14-0001203','PE05-0001204'].forEach(i=>S.sel.add(i)); p1(); openDialog(); return; }
  if (h === '#p3e') { if (!S.sel.size) { S.sel.add('PE07-0001201'); S.group = 'single'; } S.conductor=''; S.err=true; p3(); return; }
  if (h === '#p4p') { S.conductor = S.conductor || 'Andrés Mejía · ABC123'; while (S.hist.length < 3) log(['Pendiente','En preparación','En plataforma'][S.hist.length]);
    p4('plat'); if (S.undone) { S.undone = false; showPlatMsg('✓ Se deshizo el despacho: la guía volvió a <b>En plataforma</b> con los mismos datos.'); say('Se deshizo el despacho'); } else app.focus(); return; }
  if (h === '#p4e') { S.conductor='x'; if (!S.hist.length) { log('Pendiente'); log('En preparación'); } S.tries=0; p4(); document.getElementById('mov').click(); return; }
  ({'#p1':p1,'#guias':p1,'#p3':p3,'#p4':()=>p4(),'#p5':p5}[h] || p1)();
  app.focus();
}

  const t = e.target.tagName;
  if (e.key.toLowerCase()==='g' && !['INPUT','SELECT','TEXTAREA'].includes(t) && !document.getElementById('scrim') && (location.hash||'#p1')==='#p1') { e.preventDefault(); generate(); }
});
window.addEventListener('hashchange', route);
route();
