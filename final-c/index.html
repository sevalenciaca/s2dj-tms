<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TMS Suprokom · Crear y despachar guía (versión C)</title>
<style>
  :root { --tx:#1E2A3F; --tx2:#4A5568; --pri:#12306B; --acc:#B3202F; --ok:#1E6B3A; --okbg:#E8F5EC; --wr:#8A4B00; --wrbg:#FFF4E0; --er:#B42318; --erbg:#FDECEA; --fo:#1F5FD6; --ln:#CBD2DC; --bg:#F5F6F9;
    --sf:#fff; --sf2:#E6EBF4; --inb:#6B7280; --hov:#F0F4FA; --hdr:#12306B; --onhdr:#fff; --onpri:#fff; --prihov:#0B2150; --scrim:rgba(20,30,50,.45); --link:#1F5FD6; color-scheme:light; }
  * { box-sizing: border-box; }
  body { margin:0; font: 1rem/1.45 Arial, Helvetica, sans-serif; color:var(--tx); background:var(--bg); }
  header { background:var(--hdr); color:var(--onhdr); padding:12px 24px; display:flex; justify-content:space-between; align-items:center; }
  header b { font-size:1.125rem; }
  .wrap { display:flex; min-height:calc(100vh - 48px); }
  nav { width:200px; background:var(--sf); border-right:1px solid var(--ln); padding:16px 0; }
  nav a { display:block; padding:10px 20px; color:var(--tx); text-decoration:none; }
  nav a[aria-current] { background:var(--sf2); font-weight:bold; border-left:4px solid var(--pri); }
  main { flex:1; padding:24px 32px 96px; }
  h1 { font-size:1.75rem; margin:0 0 4px; }
  .sub { color:var(--tx2); font-size:0.875rem; }
  label { display:block; font-size:0.875rem; font-weight:bold; margin:12px 0 4px; }
  input, select { font:inherit; padding:8px 10px; border:1px solid var(--inb); border-radius:6px; width:100%; max-width:360px; background:var(--sf); color:var(--tx); }
  button { font:inherit; padding:9px 16px; border-radius:6px; border:1px solid var(--pri); background:var(--sf); color:var(--pri); cursor:pointer; font-weight:bold; }
  button.pri { background:var(--pri); color:var(--onpri); }
  button:disabled { opacity:.55; cursor:not-allowed; }
  :focus-visible { outline:3px solid var(--fo); outline-offset:2px; }
  table { border-collapse:collapse; width:100%; background:var(--sf); margin-top:16px; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--ln); font-size:0.9375rem; }
  th { background:var(--sf2); font-size:0.875rem; }
  .bar { position:fixed; left:200px; right:0; bottom:0; background:var(--sf); border-top:2px solid var(--pri); padding:12px 32px; display:flex; justify-content:space-between; align-items:center; }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:0.875rem; font-weight:bold; border:1px solid currentColor; }
  .msg { border-radius:6px; padding:10px 14px; margin:12px 0; font-weight:bold; }
  .msg.er { color:var(--er); background:var(--erbg); border:1px solid var(--er); }
  .msg.ok { color:var(--ok); background:var(--okbg); border:1px solid var(--ok); }
  .msg.wr { color:var(--wr); background:var(--wrbg); border:1px solid var(--wr); }
  .fielderr { color:var(--er); font-size:0.875rem; font-weight:bold; margin-top:4px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:0 32px; max-width:820px; }
  .card { background:var(--sf); border:1px solid var(--ln); border-radius:8px; padding:16px 20px; margin-top:16px; max-width:820px; }
  ol.hist { list-style:none; padding:0; margin:8px 0 0; }
  ol.hist li { border-left:3px solid var(--pri); padding:4px 0 4px 12px; margin-bottom:4px; }
  .scrim { position:fixed; inset:0; background:var(--scrim); display:flex; align-items:center; justify-content:center; }
  .dialog { background:var(--sf); border-radius:10px; padding:24px; width:min(460px, calc(100vw - 32px)); max-height:calc(100vh - 32px); overflow:auto; }
  .tablewrap { overflow-x:auto; }
  .msg { overflow-wrap:anywhere; }
  /* EDA-10: casilla de 20 px y fila completa seleccionable */
  tbody input[type=checkbox] { width:20px !important; height:20px; margin:0; vertical-align:middle; }
  tbody tr[data-id] { cursor:pointer; }
  @media (max-width: 760px) {
    html { scroll-padding-bottom:160px; }   /* 2.4.11: el foco no queda bajo la barra fija */
    header { padding:10px 16px; flex-wrap:wrap; gap:2px 12px; }
    .wrap { flex-direction:column; min-height:0; }
    nav { width:auto; display:flex; flex-wrap:wrap; border-right:0; border-bottom:1px solid var(--ln); padding:0; }
    nav a { padding:12px 14px; }
    nav a[aria-current] { border-left:0; border-bottom:4px solid var(--pri); }
    main { padding:16px 16px 150px; }
    h1 { font-size:1.375rem; }
    .bar { left:0; padding:10px 16px; flex-wrap:wrap; gap:8px; }
    .grid { grid-template-columns:1fr; }
    .steps { flex-wrap:wrap; } .steps li { flex:1 1 40%; }
    .pager { flex-wrap:wrap; }
    .dialog .row { flex-wrap:wrap; }
    input, select { max-width:100%; }
    /* HCI Lab · Ergonomía: objetivos táctiles amplios y acción principal alcanzable con el pulgar */
    button, input:not([type=checkbox]), select { min-height:44px; }
    tbody input[type=checkbox] { width:24px !important; height:24px; }
    tbody td { padding-top:12px; padding-bottom:12px; }
    .bar button.pri { flex:1 1 100%; }
    .pager button { min-width:96px; }
  }
  .dialog h2 { margin:0 0 8px; font-size:1.375rem; }
  .dialog .acts { display:flex; flex-direction:column; gap:8px; margin-top:16px; }
  .pager { display:flex; gap:8px; justify-content:flex-end; align-items:center; margin-top:8px; font-size:0.875rem; }
  [hidden] { display:none !important; }
  .dialog dl { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:12px 0 0; font-size:0.9375rem; }
  .dialog dt { color:var(--tx2); }
  .dialog dd { margin:0; font-weight:bold; }
  .dialog .row { display:flex; gap:8px; justify-content:flex-end; margin-top:20px; }
  .undo { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .undo .left { font-weight:normal; color:var(--tx); }
  .ayuda { max-width:820px; margin:8px 0; background:var(--sf); border:1px solid var(--ln); border-radius:8px; padding:8px 14px; }
  .ayuda summary { cursor:pointer; font-weight:bold; color:var(--pri); padding:4px 0; }
  .ayuda dl { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin:8px 0 4px; font-size:0.9375rem; }
  .ayuda dt { font-weight:bold; } .ayuda dd { margin:0; }
  @media (max-width: 760px) { .ayuda dl { grid-template-columns:1fr; } }
  nav.migas { width:auto; background:none; border:0; padding:0; margin:0 0 6px; font-size:0.875rem; color:var(--tx2); display:block; }
  nav.migas a { display:inline; padding:0; color:var(--link); text-decoration:underline; border:0; background:none; font-weight:normal; }
  .ver { font-size:0.8125rem; opacity:.85; margin-left:8px; }
  #app:focus { outline:none; }
  .steps { display:flex; gap:8px; margin:14px 0 4px; max-width:820px; list-style:none; padding:0; }
  .steps li { flex:1; padding:6px 10px; border-radius:6px; background:var(--sf); border:1px solid var(--ln); font-size:0.875rem; color:var(--tx2); }
  .steps li.on { border:2px solid var(--pri); color:var(--pri); font-weight:bold; }
  .steps li.done { color:var(--ok); }
  .saved { font-size:0.875rem; color:var(--ok); font-weight:bold; }
  button:hover:not(:disabled) { background:var(--sf2); } button.pri:hover:not(:disabled) { background:var(--prihov); }
  tbody tr:hover td { background:var(--hov); }
  /* ---- Iteración 3: panel de accesibilidad (preferencias en <html data-*>) ---- */
  html[data-tema="oscuro"] { --tx:#E8ECF4; --tx2:#B4BFD3; --pri:#8FB4FF; --ok:#7DDBA3; --okbg:#12301F; --wr:#F5C26B; --wrbg:#33260C; --er:#FF9F94; --erbg:#3A1714; --fo:#FFD166; --ln:#3A4762; --bg:#0F1726;
    --sf:#18233A; --sf2:#24324F; --inb:#8A97B0; --hov:#1F2C47; --hdr:#0A1120; --onhdr:#E8ECF4; --onpri:#0F1726; --prihov:#B9D0FF; --scrim:rgba(0,0,0,.6); --link:#A9C4FF; color-scheme:dark; }
  html[data-contraste="alto"] { --tx:#000; --tx2:#1A1A1A; --pri:#002266; --ok:#004D1A; --okbg:#E6FFEE; --wr:#5C3300; --wrbg:#FFF4D6; --er:#8B0000; --erbg:#FFEAEA; --fo:#B00020; --ln:#000; --bg:#fff;
    --sf:#fff; --sf2:#E8E8E8; --inb:#000; --hov:#EDEDED; --hdr:#000; --onhdr:#fff; --onpri:#fff; --prihov:#000; --link:#002266; }
  html[data-tema="oscuro"][data-contraste="alto"] { --tx:#fff; --tx2:#F0F0F0; --pri:#BFD4FF; --ok:#8CF2B4; --okbg:#000; --wr:#FFD68A; --wrbg:#000; --er:#FFB3AB; --erbg:#000; --fo:#FFE14D; --ln:#fff; --bg:#000;
    --sf:#000; --sf2:#1C1C1C; --inb:#fff; --hov:#1C1C1C; --hdr:#000; --onhdr:#fff; --onpri:#000; --prihov:#E0EAFF; --link:#BFD4FF; }
  html[data-contraste="alto"] button, html[data-contraste="alto"] input, html[data-contraste="alto"] select, html[data-contraste="alto"] .card { border-width:2px; }
  html[data-espaciado] body *:not(svg) { line-height:1.5 !important; letter-spacing:.12em !important; word-spacing:.16em !important; }
  html[data-espaciado] p { margin-bottom:2em; }
  html[data-tipo="legible"] body, html[data-tipo="legible"] input, html[data-tipo="legible"] select, html[data-tipo="legible"] button { font-family: Verdana, Tahoma, "Segoe UI", sans-serif; }
  html[data-movimiento="reducido"] *, html[data-movimiento="reducido"] *::before, html[data-movimiento="reducido"] *::after { transition:none !important; animation:none !important; scroll-behavior:auto !important; }
  html[data-foco="reforzado"] :focus-visible { outline:5px solid var(--fo); outline-offset:3px; box-shadow:0 0 0 8px var(--bg); }
  html[data-objetivos="grandes"] button, html[data-objetivos="grandes"] select, html[data-objetivos="grandes"] input:not([type=checkbox]):not([type=radio]):not([type=range]) { min-height:48px; }
  html[data-objetivos="grandes"] tbody input[type=checkbox] { width:28px !important; height:28px; }
  html[data-objetivos="grandes"] nav a { padding-top:14px; padding-bottom:14px; }
  html[data-atajos="off"] .kbd { display:none; }
  .hd { display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  .a11yb { background:transparent; color:var(--onhdr); border:2px solid var(--onhdr); padding:6px 14px; }
  .a11yb:hover:not(:disabled) { background:var(--prihov); color:#fff; }
  html[data-tema="oscuro"] .a11yb:hover:not(:disabled), html[data-contraste="alto"] .a11yb:hover:not(:disabled) { background:var(--onhdr); color:var(--hdr); }
  #a11ys { position:fixed; inset:0; background:var(--scrim); }
  #a11y { position:fixed; top:0; right:0; bottom:0; width:min(440px, 100vw); background:var(--sf); color:var(--tx); border-left:3px solid var(--pri); padding:18px 22px 40px; overflow:auto; }
  #a11y h2 { margin:0; font-size:1.375rem; }
  #a11y fieldset { border:1px solid var(--ln); border-radius:8px; padding:6px 14px 12px; margin:14px 0 0; }
  #a11y legend { font-weight:bold; padding:0 6px; }
  #a11y .opt { display:flex; gap:10px; align-items:flex-start; margin:10px 0 0; }
  #a11y .opt input[type=checkbox], #a11y .opt input[type=radio] { width:22px; height:22px; min-height:0; margin:2px 0 0; flex:none; padding:0; }
  #a11y .opt label, #a11y label.rng { margin:0; font-size:1rem; }
  #a11y .desc { display:block; font-weight:normal; color:var(--tx2); font-size:0.875rem; }
  #a11y input[type=range] { width:100%; max-width:none; padding:0; border:0; min-height:32px; background:transparent; }
  #a11y details { margin-top:14px; border:1px solid var(--ln); border-radius:8px; padding:6px 14px; }
  #a11y summary { cursor:pointer; font-weight:bold; color:var(--pri); padding:6px 0; }
  #a11y table { margin-top:6px; } #a11y th, #a11y td { font-size:0.875rem; padding:6px 8px; }
  #a11y ul { padding-left:20px; margin:6px 0; } #a11y li { margin:4px 0; font-size:0.9375rem; }
</style>
<script>
// Iteración 3 · preferencias de accesibilidad: se aplican antes de pintar y se guardan en este navegador.
const A11Y = (function () {
  const KEY = 'tms-c-a11y-v1';
  const DEF = { tema:'auto', contraste:false, escala:100, espaciado:false, legible:false, movimiento:'auto', foco:false, grandes:false, atajos:true, voz:false };
  const P = Object.assign({}, DEF);
  try { Object.assign(P, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  const mq = q => (window.matchMedia ? matchMedia(q) : { matches:false });
  const mqD = mq('(prefers-color-scheme: dark)'), mqM = mq('(prefers-reduced-motion: reduce)');
  const movReducido = () => P.movimiento === 'auto' ? mqM.matches : !!P.movimiento;
  const flag = (d, k, on, v) => { if (on) d.setAttribute('data-' + k, v); else d.removeAttribute('data-' + k); };
  function aplicar() {
    const d = document.documentElement;
    d.setAttribute('data-tema', P.tema === 'auto' ? (mqD.matches ? 'oscuro' : 'claro') : P.tema);
    flag(d, 'contraste', P.contraste, 'alto'); flag(d, 'espaciado', P.espaciado, 'si'); flag(d, 'tipo', P.legible, 'legible');
    flag(d, 'movimiento', movReducido(), 'reducido'); flag(d, 'foco', P.foco, 'reforzado'); flag(d, 'objetivos', P.grandes, 'grandes');
    d.setAttribute('data-atajos', P.atajos ? 'on' : 'off');
    d.style.fontSize = (16 * P.escala / 100) + 'px';      // todo el texto está en rem (WCAG 1.4.4)
  }
  const guardar = () => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} };
  [mqD, mqM].forEach(m => m.addEventListener && m.addEventListener('change', aplicar));
  aplicar();
  return { P, DEF, aplicar, movReducido, set(k, v) { P[k] = v; aplicar(); guardar(); },
           reset() { Object.assign(P, DEF); aplicar(); guardar(); } };
})();
</script>
</head>
<body>
<header><b>TMS Suprokom<span class="ver">· versión C</span></b><div class="hd"><span>Marta R. · Bodega</span><button type="button" class="a11yb" id="a11yb" aria-haspopup="dialog" aria-expanded="false" aria-controls="a11y">Accesibilidad</button></div></header>
<div class="wrap">
  <nav aria-label="Menú principal"><a href="#p1">Pedidos pendientes</a><a href="#guias">Guías</a><a href="formatos.html">Otros formatos</a></nav>
  <main id="app" tabindex="-1"></main>
</div>
<div id="live" class="sr" aria-live="polite" style="position:absolute;left:-9999px"></div>
<script>
const ORDERS = [
  {id:'PE07-0001201', cli:'Ferretería La 30', city:'Manizales', u:18, v:'$ 441.200', dir:'Cra 23 # 30-15, Manizales', tel:'606 884 2210'},
  {id:'PE31-0001202', cli:'Agro El Cafetal', city:'Manizales', u:12, v:'$ 719.100', dir:'Cl 48 # 22-10, Manizales', tel:'606 885 1020'},
  {id:'PE14-0001203', cli:'Distribuidora Andina', city:'Salamina', u:16, v:'$ 506.200', dir:'Cra 6 # 4-21, Salamina', tel:'606 859 3310'},
  {id:'PE05-0001204', cli:'Tienda La Esquina', city:'Manizales', u:9, v:'$ 210.000', dir:'Cl 65 # 23-05, Manizales', tel:'606 887 4455'},
  {id:'PE07-0001205', cli:'Surtiaseo del Norte', city:'Manizales', u:6, v:'$ 154.300', dir:'Av. Santander # 70-12, Manizales', tel:'606 886 9090'},
];
const S = { sel:new Set(), page:1, conductor:'', cajas:'6', lios:'2', flete:'30.000', tries:0, hist:[], group:'split',
  dtries:0, undoable:false, tra:'Transportes El Roble', num:'TMS-2026-0412', guias:[] };
// Iteración 2 (R3, 17-oct): conductores por transportadora. U01 comentó que en la operación real a veces se elige
// el conductor equivocado; dos «Andrés» en transportadoras distintas hacen visible el riesgo (datos ficticios).
const TRANS = {
  'Transportes El Roble': ['Andrés Mejía · ABC123', 'Luis Ospina · DEF456'],
  'Rápido Caldas': ['Andrés Mesa · GHI789', 'Carlos Ruiz · JKL012'],
  'Transcafé': ['Diana López · MNO345'],
};
// HZ-01 (D-34): «Deshacer despacho» sin límite de tiempo mientras la guía siga en P5 (WCAG 2.2.1);
// se cierra al pasar a la siguiente guía. Fallo simulado del despacho solo con ?simular=fallo-despacho.
const FAIL_DISPATCH = new URLSearchParams(location.search).get('simular') === 'fallo-despacho';
const CON = 'Andrés Mejía · ABC123';                     // conductor por defecto de los estados de demostración
const nombreCon = () => (S.conductor || CON).split(' · ')[0];
// Iteración 2 (HZ-04, HZ-05): la guía en curso y las guías anteriores se conservan al recargar la página.
const CLAVE = 'tms-c-guias-v2';
const guardar = () => { try { localStorage.setItem(CLAVE, JSON.stringify({ ...S, sel:[...S.sel] })); } catch (e) {} };
const DEMO = ['#p2', '#p3e', '#p4e'];                    // estados de demostración: arrancan limpios
(function cargar() {
  try {
    if (DEMO.includes(location.hash)) { localStorage.removeItem(CLAVE); return; }
    const d = JSON.parse(localStorage.getItem(CLAVE) || 'null');
    if (d) Object.assign(S, d, { sel:new Set(d.sel || []), undoable:false });
  } catch (e) {}
})();
const estadoDe = h => { const st = (h[h.length-1] || {}).st || 'Pendiente'; return st.startsWith('Despacho deshecho') ? 'En plataforma' : st; };
// Título de cada pantalla de la guía (U02: «cuando se llena la guía no tiene título, solo el número»)
const titulo = (paso, pill, color) => `<h1>Guía de despacho ${S.num} <span class="pill" style="color:${color}">${pill}</span></h1>
  <p class="sub" style="margin:2px 0 0">${paso} · ${guia().cli} → ${guia().city}</p>`;
// EDA-03, HZ-09, HZ-10: la guía se arma con los pedidos elegidos (datos ficticios)
function guia() {
  const sel = ORDERS.filter(o=>S.sel.has(o.id));
  const city = S.group==='group' ? (S.destCity || sel[0].city) : sel[0].city;
  const ped = S.group==='group' ? sel : sel.filter(o=>o.city===city);
  const otras = S.group==='group' ? [] : [...new Set(sel.map(o=>o.city))].filter(c=>c!==city);
  const d = ped.find(o=>o.city===city) || ped[0];          // destinatario: el pedido de la ciudad destino
  return { city, ped, otras, cli:d.cli, dir:d.dir, tel:d.tel,
           lista: ped.map(o=>`${o.id} (${o.cli})`).join(' · ') };
}
const app = document.getElementById('app'), live = document.getElementById('live');
const say = t => { live.textContent = ''; setTimeout(()=> live.textContent = t, 30); if (A11Y.P.voz) hablar(t); };
const cities = () => [...new Set(ORDERS.filter(o=>S.sel.has(o.id)).map(o=>o.city))];
// HCI Lab · patrón Navegación: ubicación actual visible y regreso reconocible
const migas = () => `<nav class="migas" aria-label="Ruta"><a href="#p1">Pedidos pendientes</a> <span aria-hidden="true">›</span> <a href="#guias">Guías</a> <span aria-hidden="true">›</span> <span aria-current="page">Guía ${S.num}</span></nav>`;
const stepper = n => `<ol class="steps" aria-label="Progreso de la guía">${['1. Pedidos','2. Datos de entrega','3. Empaque y plataforma','4. Despacho'].map((t,i)=>`<li class="${i+1===n?'on':i+1<n?'done':''}" ${i+1===n?'aria-current="step"':''}>${i+1<n?'✓ ':''}${t}</li>`).join('')}</ol>`;
// HZ-03: horas reales del reloj (sincronización, guardado e historial)
const hhmm = () => new Date().toLocaleTimeString('es-CO', { hour:'2-digit', minute:'2-digit', hour12:false });
S.syncAt = hhmm(); S.savedAt = hhmm(); S.q = '';
const touch = () => { S.savedAt = hhmm(); guardar(); const e = document.querySelector('.saved[data-guardado]'); if (e) e.textContent = `✓ Guardado · se conserva al recargar · ${S.savedAt}`; };
const log = (st) => { const t = hhmm(); S.savedAt = t; S.hist.push({t, st, by:'Marta R.'}); guardar(); };
// HZ-02: búsqueda por pedido, cliente o ciudad, sin distinguir tildes ni mayúsculas
const norm = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const filtrados = () => { const q = norm(S.q.trim()); return q ? ORDERS.filter(o => norm(`${o.id} ${o.cli} ${o.city}`).includes(q)) : ORDERS; };
let lastFocus = null;
// HZ-08 (D-38): ayuda contextual mínima, texto aprobado por el equipo
const ayuda = () => `<details class="ayuda"><summary>Ayuda: estados, líos y qué hacer si algo falla</summary>
  <dl>
    <dt>Lío</dt><dd>Bulto que no va en caja (por ejemplo, tubos o varillas amarrados); se cuenta aparte de las cajas.</dd>
    <dt>Estados</dt><dd>Pendiente (guía creada, faltan datos) · En preparación (se está empacando) · En plataforma (lista en el muelle para cargar) · En tránsito (salió con el conductor).</dd>
    <dt>Si el servidor no responde</dt><dd>Pulsa «Reintentar»; tus datos siguen guardados. Si vuelve a fallar, avisa a coordinación de despacho.</dd>
    <dt>Deshacer</dt><dd>Puedes deshacer el despacho en la pantalla de la guía despachada o, después, desde «Guías».</dd>
    <dt>Atajos</dt><dd>G genera la guía · E la deja lista para empacar · M la mueve a plataforma · D abre la confirmación de despacho (nunca despacha sin confirmar).</dd>
  </dl></details>`;

function p1() {

function validarEmpaque() {
  const reglas = [
    ['caj', v => /^\d+$/.test(v.trim()), '✕ Escribe las cajas como número entero (0 o más).'],
    ['lio', v => /^\d+$/.test(v.trim()), '✕ Escribe los líos como número entero (0 o más).'],
    ['fle', v => /^\d{1,3}(\.\d{3})*$|^\d+$/.test(v.trim()) && +v.replace(/\./g,'') > 0, '✕ Escribe el flete en pesos, solo con números (por ejemplo 30.000).'],
  ];
  let primero = null;
  for (const [id, ok, msg] of reglas) {
    const inp = document.getElementById(id), err = document.getElementById(id + '-err'), bien = ok(inp.value);
    err.hidden = bien; err.textContent = bien ? '' : msg;
    if (bien) inp.removeAttribute('aria-invalid'); else { inp.setAttribute('aria-invalid', 'true'); primero = primero || inp; }
  }
  const caj = +document.getElementById('caj').value || 0, lio = +document.getElementById('lio').value || 0;
  if (!primero && caj + lio === 0) { const e = document.getElementById('caj-err'); e.hidden = false; e.textContent = '✕ La guía necesita al menos una caja o un lío.'; document.getElementById('caj').setAttribute('aria-invalid','true'); primero = document.getElementById('caj'); }
  if (primero) { primero.focus(); say('Revisa el empaque: hay un dato por corregir'); }
  return !primero;
}

document.addEventListener('keydown', e => {

  if (escribe || document.getElementById('scrim') || panelAbierto() || e.ctrlKey || e.metaKey || e.altKey) return;

function hablar(t) {
  if (!('speechSynthesis' in window) || !t) return false;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = 'es-CO'; u.rate = 1;
  speechSynthesis.speak(u); return true;
}
function textoEstado() {

  const msgs = [...document.querySelectorAll('#app .msg, #app .fielderr:not([hidden])')].map(m => m.textContent.trim()).filter(Boolean);

const panelAbierto = () => { const pn = document.getElementById('a11y'); return !!pn && !pn.hidden; };
const OPCIONES = [

    ['espaciado', 'Espaciado de lectura', 'Más espacio entre renglones, letras y palabras (WCAG 1.4.12).'],
    ['legible', 'Tipografía legible', 'Letra más abierta y fácil de distinguir (Verdana).'],

  ['Movimiento e interacción', [

  ['Tema claro, oscuro o automático', '1.4.3 · 1.4.11', 'Mismo contraste mínimo en los tres; el automático sigue al sistema operativo.'],
  ['Alto contraste', '1.4.6 (AAA)', 'Contraste de 7:1 o más en el texto.'],
  ['Tamaño del texto', '1.4.4', 'Hasta 200 % sin perder contenido ni funciones.'],
  ['Espaciado de lectura', '1.4.12', 'Renglón 1,5; párrafo 2; letras 0,12; palabras 0,16.'],
  ['Tipografía legible', '—', 'Recomendación de lectura; no es un criterio WCAG.'],
  ['Reducir movimiento', '2.3.3 (AAA)', 'Sin transiciones ni animaciones.'],
  ['Foco reforzado', '2.4.7 · 2.4.13 (AAA)', 'Marco de 5 px con separación.'],

function crearPanel() {

    ${OPCIONES.map(([leg, ops]) => `<fieldset><legend>${leg}</legend>${ops.map(opt).join('')}</fieldset>`).join('')}

    </fieldset>
    <p style="margin:16px 0 0"><button type="button" id="a11yr">Restablecer preferencias</button></p>
    <details><summary>Detalles: qué cubre cada ajuste</summary>
      <table><thead><tr><th scope="col">Ajuste</th><th scope="col">WCAG 2.2</th><th scope="col">Qué hace</th></tr></thead>
      <tbody>${DETALLES.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table>
    </details>
    <details><summary>Declaración de accesibilidad</summary>
      <p style="margin:6px 0"><b>Objetivo:</b> WCAG 2.2 nivel AA en la tarea «crear y despachar la guía». Prototipo académico con datos ficticios.</p>
      <p style="margin:6px 0"><b>Probado (17-oct-2026):</b></p>
      <ul><li>axe-core 4.10.2 sin infracciones serias en el flujo completo, en tema claro, oscuro y alto contraste.</li>
        <li>Sin desplazamiento horizontal a 320 px, y con el texto al 200 %.</li>
        <li>Todo el flujo se completa solo con teclado.</li>
        <li>Árbol de accesibilidad: todos los controles tienen nombre.</li></ul>
      <p style="margin:6px 0"><b>No probado:</b> lectores de pantalla (VoiceOver, NVDA) ni pruebas con personas con discapacidad. La voz depende del navegador.</p>
      <p style="margin:6px 0"><b>Limitaciones conocidas:</b> tableta, celular y reloj son maquetas; horas y búsqueda simuladas.</p>
      <p style="margin:6px 0"><b>Reportar un problema:</b> equipo S2DJ, curso de Interacción Humano–Computador.</p>

  document.body.append(sc, pn);

    pn.querySelector('#esc').setAttribute('aria-valuetext', A11Y.P.escala + ' %');

    pn.querySelector('#o-movimiento').checked = A11Y.movReducido();
